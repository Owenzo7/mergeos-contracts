name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Node contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify package metadata
        run: node -e "const p=require('./package.json'); if(!p.name) process.exit(1)"
      - name: Run tests
        run: npm test
